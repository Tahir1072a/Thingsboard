version: "3.8"

volumes:
  kong_data: {}
  kong_db_data: {}

networks:
  kong-net:
    driver: bridge

services:
  kong-db:
    image: postgres:13
    container_name: kong-db
    hostname: kong-db
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_password_buraya_yaz
      POSTGRES_DB: kong_db
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Veritabanını Kong için Hazırla (İlk kurulumda 1 kez çalışır)
  kong-migrations:
    image: kong:3.7
    container_name: kong-migrations
    hostname: kong-migrations
    networks:
      - kong-net
    command: "kong migrations bootstrap"
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password_buraya_yaz
      KONG_PG_DATABASE: kong_db
    restart: on-failure

  # 3. Kong Gateway'i Başlat
  kong:
    image: kong:3.7
    container_name: kong
    hostname: kong
    networks:
      - kong-net
    environment:
      # ----- Veritabanı Bağlantısı -----
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password_buraya_yaz
      KONG_PG_DATABASE: kong_db

      # ----- Kong Ayarları -----
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002

      KONG_DNS_ORDER: "LAST,A,AAAA,CNAME,SRV"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      # 8000: Gateway'e gelen ana trafik (Frontend'in kullanacağı port)
      - "8000:8000"
      # 8443: Güvenli (HTTPS) trafik
      - "8443:8443"
      # 8001: Kong'u yapılandırmak için kullanılacak Admin API portu
      - "8001:8001"
      # 8002: Kong'un web arayüzü (Kong Gateway OSS 3.0+ ile geldi)
      - "8002:8002"

    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 10s
      retries: 3
